appId: com.vllmpet.app
productName: vllm-pet
copyright: MIT

directories:
  output: out

files:
  - package.json
  - dist/**
  - src/main/**
  - src/shared/**
  - build/icons/**

# 架构由各平台 CI 通过 CLI 指定（--x64 / --arm64），见 .github/workflows/release.yml

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  extendInfo:
    # macOS 14/15+ 本地网络权限：缺少该描述时系统不弹授权窗、静默拦截
    # 192.168.x.x 等局域网连接（表现：浏览器能开、应用报"服务不可达"）
    NSLocalNetworkUsageDescription: 小V需要访问局域网中的 vLLM 推理服务以获取运行状态。

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: vllm-pet

linux:
  category: Utility
  target:
    - AppImage
    - deb
